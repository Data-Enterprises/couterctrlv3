<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter Ctrl</title>
    <!-- Without these the search snippet and every pasted-link preview fall
         back to whatever prose the crawler finds first, which was the privacy
         policy's opening line. Same text twice on purpose: name= feeds Google,
         property= feeds Teams, Slack and LinkedIn. Kept under 160 characters
         so the snippet lands whole rather than truncated mid-sentence. -->
    <meta
      name="description"
      content="CounterCtrl Cloud turns POS data into weekly sales performance, loss prevention, and order variance reporting for grocery and retail operators."
    />
    <meta
      property="og:description"
      content="CounterCtrl Cloud turns POS data into weekly sales performance, loss prevention, and order variance reporting for grocery and retail operators."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
